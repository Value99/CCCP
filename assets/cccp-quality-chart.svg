      <stop offset="1" stop-color="#e8c88f"/>
    </linearGradient>
    <linearGradient id="cccp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#761816"/>
      <stop offset="1" stop-color="#c33d27"/>
    </linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#6b2b20" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" rx="16" fill="url(#paper)"/>
  <rect width="1200" height="520" rx="16" fill="url(#grain)"/>
  <rect x="0" y="0" width="14" height="520" fill="#8f201b"/>
  <text x="54" y="54" fill="#341713" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">QUALITY AT APPROXIMATELY 77 GiB</text>
  <text x="54" y="82" fill="#744235" font-family="Segoe UI,Arial,sans-serif" font-size="15">WikiText-2 · 146,115 scored tokens · official runtime BF16 logits as reference</text>

