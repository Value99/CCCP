<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CCCP quality comparison near 77 GiB</title>
  <desc id="desc">At approximately 77 GiB, CCCP-S has Mean KLD 0.291115 and same-top 83.0846 percent, compared with UD-IQ1-S at 0.645514 and 73.8110 percent.</desc>
