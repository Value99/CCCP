# 内置 Profile:角色扮演 —— 体积为估算(校准依赖 INTERFACE I-1 专家字节表)
schema: winui-expert-profile-v1
id: roleplay
name: 角色扮演
version: 1
description: 角色扮演 / 文学创作 / 拟人对话的专家组合。
tags: [dialog, creative, cn]

recipe:
  seed: tpq-winui-builtin   # 与 id 混合后确定性抽样,结果可复现
  layers: 60
  experts_per_layer: 256
  density: 0.30             # 每层抽取比例 -> 约 4600 专家 / 100 GiB(估算)
  layer_affinity: deep      # 深层偏多
  mean_size_mb: 22
  size_jitter: 0.35

drop:
  enabled: true             # drop 占位专家:发动时自动路由到组合内最相关专家
  hint_tags: [dialog, creative]

meta:
  source: builtin
  calibrated: false         # 体积为估算,UI 显著标注
