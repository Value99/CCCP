[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cccp-inference"
version = "1.2.0"
description = "CCCP inference runtime for CCCP GLM, DeepSeek and Kimi models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "tokenizers>=0.22,<0.24",
  "tiktoken>=0.11,<1",
  "psutil>=7,<8",
  "ninja>=1.13,<2",
  "numpy>=2,<3",
]

[project.optional-dependencies]
cuda = [
  "flashinfer-python>=0.6.6,<0.7",
  "fla-core>=0.5.2,<0.6",
  "triton>=3.6,<3.7",
]
media = [
  "Pillow>=10,<13",
  "av>=14,<16",
]
api = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic>=2,<3",
  "starlette>=0.47,<1",
]

[project.scripts]
cccp = "cccp.__main__:main"
cccp-launch = "cccp.launch:main"
cccp-check = "cccp.check:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cccp*"]

[tool.setuptools.package-data]
cccp = [
  "configs/*.json",
  "csrc/*.cu",
  "csrc/*.cpp",
  "csrc/*.cuh",
  "csrc/LICENSE*"
]
